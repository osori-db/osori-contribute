name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:cf
      # cloudflare/wrangler-action 을 쓰지 않는다. 그 액션은 자기가 고정한 wrangler 를
      # 따로 설치하는데, 그 버전이 package.json 의 것을 덮어쓴다. 실제로 3.90.0 이 깔려
      # wrangler.jsonc 를 읽지 못했고(JSONC 지원은 3.91+), main 을 못 찾아 배포가 깨졌다.
      # npm ci 로 설치된 버전을 그대로 쓰면 package-lock.json 이 단일 기준이 된다.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
